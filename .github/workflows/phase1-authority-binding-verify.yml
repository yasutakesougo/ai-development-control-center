name: phase1-authority-binding-verify

on:
  push:
    branches:
      - loop-graph-authority-phase1-v1
    paths:
      - "src/domain/authorityApproval.ts"
      - "src/worker/authority/**"
      - "src/worker/execution/**"
      - "src/worker/index.ts"
      - "src/workers/authorityRecorder/**"
      - "src/workers/authorityExecutionEnforcer/**"
      - "infrastructure/**"
      - "scripts/generate-authority-receipt-keypair.mjs"
      - "test/authorityApproval.test.ts"
      - "test/executionEnforcement.test.ts"
      - "test/trustedAuthorityRecorder.test.ts"
      - "test/githubActionsOidc.test.ts"
      - "test/authorityExecutionEnforcer.test.ts"
      - "test/ac7InfrastructureBoundary.test.ts"
      - "test/helpers/sqliteAuthorityDbs.ts"
      - "test/helpers/sqliteLedgerDb.ts"
      - "wrangler.jsonc"
      - ".github/workflows/phase1-authority-binding-verify.yml"
      - ".github/workflows/main-deployment-gateway.yml"
      - ".gitignore"
      - "package.json"
  pull_request:
    branches:
      - main
    paths:
      - "src/domain/authorityApproval.ts"
      - "src/worker/authority/**"
      - "src/worker/execution/**"
      - "src/worker/index.ts"
      - "src/workers/authorityRecorder/**"
      - "src/workers/authorityExecutionEnforcer/**"
      - "infrastructure/**"
      - "scripts/generate-authority-receipt-keypair.mjs"
      - "test/authorityApproval.test.ts"
      - "test/executionEnforcement.test.ts"
      - "test/trustedAuthorityRecorder.test.ts"
      - "test/githubActionsOidc.test.ts"
      - "test/authorityExecutionEnforcer.test.ts"
      - "test/ac7InfrastructureBoundary.test.ts"
      - "test/helpers/sqliteAuthorityDbs.ts"
      - "test/helpers/sqliteLedgerDb.ts"
      - "wrangler.jsonc"
      - ".github/workflows/phase1-authority-binding-verify.yml"
      - ".github/workflows/main-deployment-gateway.yml"
      - ".gitignore"
      - "package.json"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck, tests, build
        run: npm run verify
